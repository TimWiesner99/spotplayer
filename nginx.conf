# nginx.conf — Nginx configuration for the SpotPlayer LXC container
#
# Topology:
#   [Browser] → [Nginx Proxy Manager on Proxmox host, port 443]
#             → [This LXC, port 80]
#             → [uvicorn on 127.0.0.1:8000]
#
# This file should be placed at /etc/nginx/sites-available/spotplayer
# and symlinked to /etc/nginx/sites-enabled/spotplayer.
#
# Key responsibilities of this Nginx:
#   1. Proxy all normal requests to uvicorn (FastAPI).
#   2. Handle X-Accel-Redirect for authenticated media serving.
#      FastAPI performs the auth check, then returns a response with
#      X-Accel-Redirect: /internal/media/<path>
#      Nginx intercepts that header and serves the file directly from disk,
#      supporting HTTP Range requests so large video files are seekable.
#
# IMPORTANT: The /internal/media/ location must NOT be publicly accessible.
# The `internal` directive enforces this — Nginx will 404 any direct request
# to /internal/*, but will honour the header from an upstream proxy.

server {
    listen 80;
    server_name _;          # Catch-all; NPM on the host handles the real hostname.

    # ── Client body size ──────────────────────────────────────────────────
    # Each chunk upload is ≤ 50 MB. Set the limit slightly above that.
    # (Cloudflare free plan enforces its own 100 MB limit upstream.)
    client_max_body_size 55M;

    # Increase timeouts for large chunk uploads on slow connections.
    client_body_timeout    300s;
    send_timeout           300s;
    proxy_read_timeout     300s;
    proxy_send_timeout     300s;

    # ── Internal media location (X-Accel-Redirect target) ─────────────────
    # The `internal` directive prevents direct browser access.
    # The alias path must match MEDIA_ROOT in .env (default: /data).
    location /internal/media/ {
        internal;
        alias /data/;

        # Enable efficient sendfile for large files.
        sendfile           on;
        sendfile_max_chunk 2m;
        tcp_nopush         on;

        # Required for video seeking: honour Range request headers.
        # (Nginx does this by default, but be explicit for clarity.)
        add_header Accept-Ranges bytes;
    }

    # NOTE: /static/ is intentionally NOT handled here.
    # FastAPI's StaticFiles middleware serves CSS/JS directly from uvicorn.
    # This avoids permission issues with Nginx reading files inside /home/tim.
    # For 2-10 concurrent users the overhead is negligible.

    # ── FastAPI / uvicorn (handles everything including /static/) ─────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard proxy headers so FastAPI sees the real client IP.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for EventSource / streaming responses if added later.
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }
}
